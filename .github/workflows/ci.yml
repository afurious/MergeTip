name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'openapi/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'openapi/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mergetip
          POSTGRES_PASSWORD: mergetip
          POSTGRES_DB: mergetip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mergetip" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://mergetip:mergetip@localhost:5432/mergetip
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: backend/Cargo.toml

  coverage:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mergetip
          POSTGRES_PASSWORD: mergetip
          POSTGRES_DB: mergetip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mergetip" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://mergetip:mergetip@localhost:5432/mergetip
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # The whole workspace's tests count toward each crate (the engine and e2e tests exercise
      # the payer); the gate then checks each crate's own src/ against its floor.
      - run: cargo llvm-cov --workspace --all-features --no-report
      - name: Coverage floors (parser, core, payer ≥ 90%; github ≥ 70%)
        run: cargo llvm-cov report --json --summary-only | python3 scripts/coverage_gate.py

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API client is up to date with openapi.json
        run: pnpm gen:api && git diff --exit-code packages/api-client/src/schema.d.ts
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
