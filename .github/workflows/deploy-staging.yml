name: Deploy staging

# Deploys the backend to staging after CI succeeds on main; migrations run first (the api's
# release_command).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    defaults:
      run:
        # The Docker build context is the backend workspace.
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Deploy api (runs migrations first)
        run: >-
          flyctl deploy . --config ../deploy/fly/api.staging.toml --dockerfile Dockerfile
          --remote-only --build-arg VERSION="${SHA::12}" --build-arg GIT_SHA="${SHA}"
      - name: Deploy worker
        run: >-
          flyctl deploy . --config ../deploy/fly/worker.staging.toml --dockerfile Dockerfile
          --remote-only --build-arg VERSION="${SHA::12}" --build-arg GIT_SHA="${SHA}"
      - name: Smoke test
        run: |
          for _ in 1 2 3 4 5 6; do
            if curl -fsS https://api.staging.mergetip.dev/v1/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 10
          done
          echo "staging /v1/health did not answer ok" >&2
          exit 1
