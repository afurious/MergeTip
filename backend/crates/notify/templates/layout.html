<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{ subject }}</title></head>
<body style="font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; color: #1f2328; line-height: 1.5; max-width: 560px; margin: 0 auto; padding: 24px;">
<p style="font-size: 20px; font-weight: 600; margin: 0 0 16px;">⚡ MergeTip</p>
{% block content %}{% endblock %}
<hr style="border: none; border-top: 1px solid #d0d7de; margin: 32px 0 16px;">
<p style="font-size: 12px; color: #59636e;">{% block footer %}You get this because someone tipped you on GitHub with MergeTip. MergeTip never holds your money: tips go straight from the sender's wallet to yours. <a href="{{ unsubscribe_url }}" style="color: #59636e;">Unsubscribe</a> from these emails; you'll still get GitHub mentions.{% endblock %}</p>
</body>
</html>
