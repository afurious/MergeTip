# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# CC0-1.0: the rust-bitcoin and secp256k1 crates behind lightning-invoice and nwc (public-domain
# dedication). MITNFA: hex_lit, MIT plus "no false attribution". 0BSD: quoted_printable, used by
# lettre for email bodies. All three are permissive with no copyleft or patent terms.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0", "CC0-1.0", "MITNFA", "0BSD"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
