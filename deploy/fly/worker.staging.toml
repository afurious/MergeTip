# Fly.io config for mergetip-worker (staging). Deploy: fly deploy -c deploy/fly/worker.staging.toml
app = "mergetip-worker-staging"
primary_region = "jnb"

[build]
  dockerfile = "../../backend/Dockerfile"
  [build.args]
    BIN = "mergetip-worker"

[env]
  APP_ENV = "staging"
  METRICS_ADDR = "0.0.0.0:9091"

[metrics]
  port = 9091
  path = "/metrics"
